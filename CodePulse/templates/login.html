{% extends "base.html" %}

{% block content %}

<h2>Login to CodePulse</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <div>
        <label>Username:</label>
        <input type="text" name="username" required>
    </div>

    <br>

    <div>
        <label>Password:</label>
        <input type="password" name="password" required>
    </div>

    <br>

    <button type="submit">
        Login
    </button>
</form>

{% endblock %}
